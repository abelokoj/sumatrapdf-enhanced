name: Enhanced release
on:
  push:
    branches: [master]
    paths: [enhanced-version.txt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enhanced-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/master' && github.repository == 'abelokoj/sumatrapdf-enhanced'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - id: version
        name: Check release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = & bun cmd/gen-enhanced-version.ts --check
          if ($LASTEXITCODE -ne 0) { throw 'Invalid enhanced-version.txt' }
          "version=$version" >> $env:GITHUB_OUTPUT
          . ./cmd/helper/enhanced-version.ps1
          $historyJson = & gh api --paginate --slurp "repos/$env:GH_REPO/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify complete release sequence' }
          $historyPages = $historyJson | ConvertFrom-Json
          $history = @($historyPages | ForEach-Object { $_ })
          if (@($history | Where-Object { -not $_.draft -and $_.tag_name -eq "enhanced-$version" }).Count) {
            Write-Output 'Version already published. Update enhanced-version.txt for a new release.'
            'publish=false' >> $env:GITHUB_OUTPUT
          } else {
            Assert-EnhancedReleaseSequence $version $history
            'publish=true' >> $env:GITHUB_OUTPUT
          }
  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build-windows.yml
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: enhanced-*
          path: release-packages
          merge-multiple: true
      - name: Validate and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./cmd/publish-enhanced.ps1 -Version '${{ needs.prepare.outputs.version }}' -PackageDirectory release-packages -SourceCommit '${{ github.sha }}'
